name: Tyro Payments packages
generated: '2026-10-21'
method: searched
source: https://docs.connect.tyro.com/llms.txt
note: >-
  Tyro distributes its SDKs through GitHub (GitHub Packages for npm/Maven, Swift Package Manager repos),
  not public registries. registry.npmjs.org has no @tyro/tyro-pay-api-react-native (404), search.maven.org
  has no com.tyro group (0 results), and NuGet search for "tyro" returns only unrelated publishers.
  GitHub Packages endpoints require a token (npm.pkg.github.com answered 401), so versions/dates are read
  from the public GitHub repos' releases/tags where those exist.
