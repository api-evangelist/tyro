server:
  name: MCP server
  version: '2026-10-21'
  protocolVersion: '2025-06-18'
  platform: Redocly (docs.connect.tyro.com is a Redocly portal)
  capabilities:
  - logging
  - tools (listChanged)
  note: 'A plain GET returns HTTP 405 with {"error":"Method Not Allowed","message":"In order to use this MCP server, you need
    register it in your MCP Client (VS Code, Cursor, Claude Code, etc.) using that URL: http://docs.connect.tyro.com/mcp"}.
    initialize and tools/list over POST returned 200 (text/event-stream) without credentials.'
scope: Documentation / API-description server. Its tools read the Tyro Connect API catalogue, OpenAPI descriptions and docs
  search; none of them calls the Tyro Connect REST APIs (api.tyro.com/connect) or moves money.
auth:
  type: none
  note: No auth on the docs MCP. The REST APIs it describes use OAuth 2.0 client_credentials (see authentication/tyro-authentication.yml).
tools:
- name: list-apis
  description: Lists available APIs with their context and purpose
  inputSchema:
    type: object
    additionalProperties: false
    required: []
    properties:
      filter:
        type: string
        description: API name (or part of it)
        minLength: 1
        nullable: true
      page:
        type: number
        description: Page number
        minimum: 1
        default: 1
        nullable: true
      limit:
        type: number
        description: Number of APIs per page. Default is 300
        minimum: 1
        default: 300
        nullable: true
  source: tools/list (live)
- name: get-endpoints
  description: Get all endpoints for a specific API
  inputSchema:
    type: object
    required:
    - name
    additionalProperties: false
    properties:
      name:
        type: string
        description: API name
        minLength: 1
  source: tools/list (live)
- name: get-endpoint-info
  description: Get comprehensive information about specific endpoint including parameters, security, and examples
  inputSchema:
    type: object
    required:
    - name
    - path
    - method
    additionalProperties: false
    properties:
      name:
        type: string
        description: API name
        minLength: 1
      path:
        type: string
        description: Endpoint path (e.g. /api/v1/users)
        minLength: 1
      method:
        type: string
        description: HTTP method (GET, POST, PUT, DELETE, etc.)
        enum:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
        - HEAD
        - TRACE
        - get
        - post
        - put
        - delete
        - patch
        - options
        - head
        - trace
        minLength: 1
  source: tools/list (live)
- name: get-security-schemes
  description: Get the security schemes for a specific API
  inputSchema:
    type: object
    required:
    - name
    additionalProperties: false
    properties:
      name:
        type: string
        description: API name
        minLength: 1
  source: tools/list (live)
- name: get-full-api-description
  description: Get the complete OpenAPI description
  inputSchema:
    type: object
    required:
    - name
    additionalProperties: false
    properties:
      name:
        type: string
        description: API name
        minLength: 1
  source: tools/list (live)
- name: search
  description: Search across the documentation to fetch relevant content for a given query
  inputSchema:
    type: object
    required:
