openapi: 3.1.0
info:
  title: Reporting API
  version: '1.0'
  contact: {}
  description: >-
    This API allows you to retrieve various transaction and settlements data for
    a given mid.
servers:
  - url: https://api.tyro.com/connect
    description: Production
paths:
  /reporting/merchants/{mid}/settlements?settlementDate={settlementDate}:
    get:
      responses:
        '200':
          description: Settlements response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reporting-settlements-response'
              examples:
                Single Settlement Returned:
                  value:
                    mid: '111'
                    settlementDate: '2021-07-01'
                    settlements:
                      - clearingPaymentId: e6da4a8e-70f3-4156-9b81-f027f061d59e
                        grossAmount: 20011
                        settlementDetails:
                          - type: EXTERNAL_BANK_ACCOUNT
                            bsb: '840300'
                            institutionName: MyBank
                            accountNumber: '****9201'
                            accountName: Potene Enterprises Pty Ltd
                            settlementAmount: 20011
                            lastUpdatedAt: '2021-07-01T13:45:15.000Z'
                            settlementStatus: SENT
                            lodgementReference: Tyro July 1st
                Multiple Settlements Returned:
                  value:
                    mid: '112'
                    settlementDate: '2021-07-01'
                    settlements:
                      - clearingPaymentId: e6da4a8e-70f3-4156-9b81-f027f061d59e
                        grossAmount: 150032
                        settlementDetails:
                          - type: EXTERNAL_BANK_ACCOUNT
                            institutionName: MyBank
                            bsb: '840300'
                            accountNumber: '****9201'
                            accountName: Potene Enterprises Pty Ltd
                            settlementAmount: 20011
                            lastUpdatedAt: '2021-07-01T13:45:15.000Z'
                            settlementStatus: SENT
                            lodgementReference: Tyro July 1st
                          - type: EXTERNAL_BANK_ACCOUNT
                            institutionName: MyBank
                            bsb: '840300'
                            accountNumber: '****9201'
                            accountName: Potene Enterprises Pty Ltd
                            settlementAmount: 120021
                            settlementStatus: PENDING
                            lodgementReference: Tyro July 1st
                          - type: TYRO_BANK_ACCOUNT
        '400':
          description: Bad Request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  errorCode:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
        '403':
          description: >-
            Forbidden - When you don't have the required permissions to query
            the provided location
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      description: >-
        This endpoint allows you to retrieve BECs-cleared settlement details for
        a specific merchant on a given date.
      parameters:
        - in: path
          description: >-
            The merchant ID associated with the Tyro account. Used to identify
            the merchant whose settlement data is being retrieved.
          name: mid
          required: true
          schema:
            type: string
        - in: query
          description: >-
            Requested settlement date (YYYY-MM-DD). Must be within the past 3
            years.
          name: settlementDate
          required: true
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/header-bearer-token'
      operationId: get-reporting-settlements
      summary: Get Settlements for a Merchant
      security:
        - JWT: []
  /reporting/merchants/{mid}/transactions?transactionDate={transactionDate}&limit=100&page=1:
