openapi: 3.1.0
info:
  title: Menu API
  version: '1.0'
  contact: {}
  description: >
    This API allows a POS to synchronise menu details with Tyro Connect, and
    allows Apps to retrieve the published menu for a location.
servers:
  - url: https://api.tyro.com/connect
    description: Production
paths:
  /menus/{tcLocationId}/app/sync:
    get:
      responses:
        '204':
          description: No body content
        '403':
          description: >-
            When you don't have the required permissions to get menu for the
            given location
        '404':
          description: >-
            When the POS associated with the location has not Menu API enabled
            and we were unable to find a local version of their menu
        '409':
          description: When an existing request for menu sync is still in progress
      description: |-
        **App only.**

        This endpoint starts the process of generating the latest published menu
      parameters:
        - in: path
          description: Tyro Connect Location Id for which menu should be retrieved
          name: tcLocationId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/header-bearer-token'
      operationId: request-latest-menu
      summary: Request latest menu
      security:
        - JWT: []
  /menus/{tcLocationId}/app/published:
    get:
      responses:
        '200':
          description: The published menu response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/menu'
        '403':
          description: >-
            When you don't have the required permissions to get menu for the
            given location
        '409':
          description: When an existing request for menu sync is still in progress
      description: |-
        **App only.**

        Used to fetch the latest published menu
      parameters:
        - in: path
          description: Tyro Connect Location Id for which menu should be retrieved
          name: tcLocationId
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/header-bearer-token'
      operationId: fetch-latest-menu
      summary: Fetch latest menu
      security:
        - JWT: []
  /menus/{tcLocationId}/sync:
    put:
      summary: Synchronise menu
      description: >-
        **POS only.**


        This endpoint is used to synchronise a POS menu with Tyro Connect when
        the POS receives the MENU_SYNC_REQUESTED notification.
      operationId: sync-menu-request
      responses:
        '204':
          description: No body content. Menu successfully updated
        '400':
          description: When the provided payload is not valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: The validation error message.
              examples:
                Missing property:
                  value:
                    error: '"ticketNumber" is required'
        '403':
          description: When you don't have the right permissions to synchronise a menu
        '404':
          description: When the location provided was not found
        '409':
          description: When a ticket number is provided but is invalid or expired
      security:
        - JWT: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/menu'
