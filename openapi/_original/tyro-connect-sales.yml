openapi: 3.1.0
info:
  title: Sales Data API
  version: '1.1'
  contact: {}
  description: |
    This is the API for Apps looking to implement sales data on Tyro Connect
servers:
  - url: https://api.tyro.com/connect
    description: Production
paths:
  /sales:
    get:
      summary: List Sales
      operationId: list-sales-1.1
      description: >
        This endpoint returns all the sales of a given location. The list of
        sales is paginated and it is possible to apply filters to the sales
        being fetched.


        ## Filtering


        The filtering options use an "OR" clause within the same filter criteria
        and an "AND" clause between criteria.


        This means that a request with `saleStatus=OPEN&saleType=SALE` will
        return the sales that were `OPEN` *and* that of type `SALE`.


        A request with `saleType=SALE&saleType=REFUND` will return the sales
        that have either sale type `SALE` *or* `REFUND`.


        ## Pagination


        The paginated results are ordered using the sequence they were created
        in the Tyro Connect. For example `results[0]` on page 1 is the first
        matching sale that was created in the Tyro Connect system.
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/header-bearer-token'
        - schema:
            type: string
            example: luna-park
          in: query
          name: locationId
          required: true
          description: >-
            The Tyro Connect Location Id of the sales to be retrieved. This
            parameter is required.
        - schema:
            type: string
            enum:
              - OPEN
              - CLOSED
              - REOPENED
          in: query
          name: saleStatus
          description: Returns results based on the status of a sale.
        - schema:
            type: string
            enum:
              - COMBINATION
              - SALE
              - REFUND
              - VOID
          in: query
          name: saleType
          description: |-
            Returns results based on the type of a sale.

            Can be a single string or multi string value.
        - schema:
            type: string
            format: date
            example: '2023-04-29'
            pattern: ''
          in: query
          name: fromDate
          description: >-
            Returns results that have a "startTime" later than or equal to the
            provided value.


            Format: YYYY-MM-DD
        - schema:
            type: string
            example: '2023-04-28'
          in: query
          name: toDate
          description: >-
            Returns results that have a "startTime" before than or equal to the
            provided value.


            Format: YYYY-MM-DD
        - schema:
            type: string
            enum:
              - CREATED
              - UPDATED
              - OPENED
              - CLOSED
            default: CREATED
          in: query
          name: dateType
          description: Specifies the date type of the 'fromDate' and 'toDate' parameters.
        - schema:
            type: number
            minimum: 1
            maximum: 50
            example: 10
          in: query
          name: limit
          description: |-
            Specifies the amount of results to be retrieved.

            A maximum of 50 results are returned if this value is not provided.
        - schema:
            type: number
            minimum: 1
            example: 2
          in: query
          name: page
          description: >-
            Specify the page to retrieve.


            You will need to use this setting if you wish to retrieve specific
            pages.


            Page-numbering is based on the value of "limit". If limit=5, then
            page=1 will display the hits from 1 to 5, page=3 will display the
            hits from 11 to 15.


            Page numbers start at 1.


            A request for a non-existing page will yield 0 results.
      responses:
        '200':
          description: The sales list
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    description: >-
                      The results for the location that satisfy the filtering
                      criteria
                    items:
                      $ref: '#/components/schemas/sale'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        minimum: 1
                      size:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                    required:
                      - page
                      - size
                      - limit
                      - total
                required:
                  - results
                  - pagination
              examples:
                saleStatus=CLOSED&saleType=SALEsaleType=COMBINATION&fromDate=2023-05-04&toDate=2023-05-04:
                  value:
                    pagination:
                      page: 1
                      size: 2
                      limit: 10
                      total: 2
                    results:
                      - version: 69
                        locationId: luna-park
                        origin:
                          saleId: SaleId
                        source:
                          type: MEANDU
                        type: SALE
                        status: CLOSED
                        openedZonedDateTime: '2018-05-02T08:28:13+10:00'
                        closedZonedDateTime: '2018-05-02T08:28:13+10:00'
                        staff:
                          id: '8675309'
                        bookingId: 6dca53a9-04c7-46aa-991c-cfdf51a8f652
                        items:
                          - id: DRINK-123
                            name: Diet Soda
                            sku: '1123581321'
                            unitPrice:
                              amount: 123
                              currency: AUD
                            unitPriceTax:
                              amount: 123
                              currency: AUD
                            quantity: 3
                            tax:
                              amount: 369
                              currency: AUD
                            total:
                              amount: 369
                              currency: AUD
                        payments:
                          - acquirer:
                              name: TYRO
                              transactionReference: 88888888-4444-4444-4444-121212121212
                              terminalId: '57'
                            method: EFTPOS
                            type: SALE
                            goodsAndServicesAmount:
                              amount: 123
                              currency: AUD
                        tax:
                          amount: 123
                          currency: AUD
                        total:
                          amount: 369
                          currency: AUD
                        table:
                          seats: 1
                          number: '11'
                        subtotal:
                          amount: 369
                          currency: AUD
                      - version: 69
                        locationId: luna-park
                        origin:
                          saleId: SaleId
                          locationId: POS-0000001
                        source:
                          type: MEANDU
                        type: COMBINATION
                        status: CLOSED
                        openedZonedDateTime: '2018-05-02T08:28:13+10:00'
                        closedZonedDateTime: '2018-05-02T08:28:13+10:00'
                        staff:
                          id: '8675309'
                        bookingId: 6dca53a9-04c7-46aa-991c-cfdf51a8f652
                        items:
                          - id: DRINK-123
                            name: Diet Soda
                            sku: '1123581321'
                            sale:
                              type: SALE
                            unitPrice:
                              amount: 123
                              currency: AUD
                            unitPriceTax:
                              amount: 123
                              currency: AUD
                            quantity: 3
                            tax:
                              amount: 369
                              currency: AUD
                            total:
                              amount: 369
                              currency: AUD
                          - id: DRINK-1322
                            name: Soda
                            sku: '1123581322'
                            sale:
                              type: REFUND
                            unitPrice:
                              amount: 123
                              currency: AUD
                            unitPriceTax:
                              amount: 123
                              currency: AUD
                            quantity: 3
                            tax:
                              amount: 369
                              currency: AUD
                            total:
                              amount: 369
                              currency: AUD
                        payments:
                          - acquirer:
                              name: TYRO
                              transactionReference: 88888888-4444-4444-4444-121212121212
                              terminalId: '57'
                            method: EFTPOS
                            type: SALE
                            goodsAndServicesAmount:
                              amount: 123
                              currency: AUD
                        tax:
                          amount: 123
                          currency: AUD
                        total:
                          amount: 369
                          currency: AUD
        '403':
          description: >-
            When you don't have the right permissions to fetch the sales for the
            provided location
  /sales/{saleId}:
    get:
      summary: Get Sales Data by SalesId
      responses:
        '200':
          description: The sales response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sale'
              examples:
                Example Sale:
                  value:
                    version: 69
                    locationId: luna-park
                    origin:
                      saleId: SaleId
                    source:
                      type: MEANDU
                    type: SALE
                    status: CLOSED
                    openedZonedDateTime: '2018-05-02T08:28:13+10:00'
                    closedZonedDateTime: '2018-05-02T08:28:13+10:00'
                    staff:
                      id: '8675309'
                    bookingId: 6dca53a9-04c7-46aa-991c-cfdf51a8f652
                    items:
                      - id: DRINK-123
                        name: Diet Soda
                        sku: '1123581321'
                        unitPrice:
                          amount: 123
                          currency: AUD
                        unitPriceTax:
                          amount: 123
                          currency: AUD
                        quantity: 3
                        tax:
                          amount: 369
                          currency: AUD
                        total:
                          amount: 369
                          currency: AUD
                    payments:
                      - acquirer:
                          name: TYRO
                          transactionReference: 88888888-4444-4444-4444-121212121212
                          terminalId: '57'
                        method: EFTPOS
                        type: SALE
                        goodsAndServicesAmount:
                          amount: 123
                          currency: AUD
                    tax:
                      amount: 123
                      currency: AUD
                    total:
                      amount: 369
                      currency: AUD
                    table:
                      seats: 1
                      number: '11'
                    subtotal:
                      amount: 369
                      currency: AUD
                Combination Sale:
                  value:
                    version: 69
                    locationId: luna-park
                    origin:
                      saleId: SaleId
                      locationId: POS-0000001
                    source:
                      type: MEANDU
                    type: COMBINATION
                    status: CLOSED
                    openedZonedDateTime: '2018-05-02T08:28:13+10:00'
                    closedZonedDateTime: '2018-05-02T08:28:13+10:00'
                    staff:
                      id: '8675309'
                    bookingId: 6dca53a9-04c7-46aa-991c-cfdf51a8f652
                    items:
                      - id: DRINK-123
                        name: Diet Soda
                        sku: '1123581321'
                        sale:
                          type: SALE
                        unitPrice:
                          amount: 123
                          currency: AUD
                        unitPriceTax:
                          amount: 123
                          currency: AUD
                        quantity: 3
                        tax:
                          amount: 369
                          currency: AUD
                        total:
                          amount: 369
                          currency: AUD
                      - id: DRINK-1322
                        name: Soda
                        sku: '1123581322'
                        sale:
                          type: REFUND
                        unitPrice:
                          amount: 123
                          currency: AUD
                        unitPriceTax:
                          amount: 123
                          currency: AUD
                        quantity: 3
                        tax:
                          amount: 369
                          currency: AUD
                        total:
                          amount: 369
                          currency: AUD
                    payments:
                      - acquirer:
                          name: TYRO
                          transactionReference: 88888888-4444-4444-4444-121212121212
                          terminalId: '57'
                        method: EFTPOS
                        type: SALE
                        goodsAndServicesAmount:
