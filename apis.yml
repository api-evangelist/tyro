aid: tyro
url: https://raw.githubusercontent.com/api-evangelist/tyro/refs/heads/main/apis.yml
name: Tyro Payments
kind: company
description: 'Tyro Payments is an ASX-listed Australian payments company and one of the country''s largest
  merchant acquirers outside the major banks, holding its own banking licence. Founded in 2003, Tyro provides
  EFTPOS terminals, in-person and online card acceptance, and integrated payments for more than 70,000
  Australian merchants across hospitality, retail and health. Its developer surface, Tyro Connect, is
  a genuinely API-first platform: a REST API family (served from https://api.tyro.com/connect and secured
  with OpenID Connect / OAuth 2.0) that links Point of Sale software, ordering, booking, loyalty and reporting
  apps to Tyro merchants, alongside Tyro.js, mobile SDKs and Tap to Pay (SoftPOS) for card-present and
  online payments. Home market is Australia.'
